<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم - خدماتي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --primary:#FF6B2B; --primary-dark:#e55a1e; --dark:#0D0D0D; --dark2:#141414; --dark3:#1E1E1E; --dark4:#252525; --light:#F5F5F0; --gray:#666; --green:#22c55e; --yellow:#f59e0b; --red:#ef4444; --blue:#3b82f6; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Cairo',sans-serif; background:var(--dark); color:var(--light); display:flex; min-height:100vh; }
  .sidebar { width:260px; min-height:100vh; background:var(--dark2); border-left:1px solid rgba(255,255,255,0.06); display:flex; flex-direction:column; position:fixed; right:0; top:0; bottom:0; z-index:100; }
  .sidebar-logo { padding:28px 24px; border-bottom:1px solid rgba(255,255,255,0.06); }
  .sidebar-logo h2 { font-size:1.4rem; font-weight:900; color:var(--primary); }
  .sidebar-logo span { color:var(--light); }
  .sidebar-logo p { font-size:0.75rem; color:var(--gray); margin-top:2px; }
  .sidebar-nav { padding:20px 12px; flex:1; }
  .nav-item { display:flex; align-items:center; gap:12px; padding:12px 16px; border-radius:12px; cursor:pointer; transition:0.2s; margin-bottom:4px; color:#888; font-weight:600; font-size:0.95rem; text-decoration:none; }
  .nav-item:hover { background:var(--dark4); color:var(--light); }
  .nav-item.active { background:rgba(255,107,43,0.12); color:var(--primary); }
  .sidebar-footer { padding:20px 24px; border-top:1px solid rgba(255,255,255,0.06); font-size:0.8rem; color:var(--gray); }
  .main { margin-right:260px; flex:1; padding:32px; }
  .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:32px; }
  .topbar h1 { font-size:1.6rem; font-weight:900; }
  .topbar p { color:var(--gray); font-size:0.9rem; margin-top:2px; }
  .topbar-actions { display:flex; gap:12px; align-items:center; }
  .refresh-btn { background:var(--primary); color:white; border:none; padding:10px 20px; border-radius:50px; font-family:'Cairo',sans-serif; font-weight:700; font-size:0.9rem; cursor:pointer; transition:0.3s; }
  .refresh-btn:hover { background:var(--primary-dark); }
  .admin-avatar { width:42px; height:42px; border-radius:12px; background:var(--primary); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:1rem; cursor:pointer; }
  .stats-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:20px; margin-bottom:32px; }
  .stat-card { background:var(--dark3); border:1px solid rgba(255,255,255,0.06); border-radius:18px; padding:24px; transition:0.2s; }
  .stat-card:hover { transform:translateY(-3px); border-color:rgba(255,107,43,0.2); }
  .stat-top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px; }
  .stat-icon { font-size:1.8rem; }
  .stat-badge { font-size:0.75rem; font-weight:700; padding:4px 10px; border-radius:20px; }
  .badge-green { background:rgba(34,197,94,0.12); color:var(--green); }
  .badge-yellow { background:rgba(245,158,11,0.12); color:var(--yellow); }
  .badge-blue { background:rgba(59,130,246,0.12); color:var(--blue); }
  .stat-num { font-size:2.2rem; font-weight:900; }
  .stat-label { color:var(--gray); font-size:0.85rem; margin-top:4px; }
  .tabs { display:flex; gap:8px; margin-bottom:24px; }
  .tab { padding:8px 20px; border-radius:50px; font-family:'Cairo',sans-serif; font-weight:700; font-size:0.9rem; cursor:pointer; transition:0.2s; border:1px solid rgba(255,255,255,0.08); background:transparent; color:#888; }
  .tab.active { background:var(--primary); color:white; border-color:var(--primary); }
  .tab:hover:not(.active) { border-color:var(--primary); color:var(--primary); }
  .table-container { background:var(--dark3); border:1px solid rgba(255,255,255,0.06); border-radius:18px; overflow:hidden; }
  .table-header { padding:20px 24px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(255,255,255,0.06); }
  .table-header h3 { font-size:1rem; font-weight:700; }
  .search-input { background:var(--dark4); border:1px solid rgba(255,255,255,0.08); border-radius:10px; padding:8px 16px; color:var(--light); font-family:'Cairo',sans-serif; font-size:0.85rem; outline:none; width:220px; transition:0.2s; }
  .search-input:focus { border-color:var(--primary); }
  .search-input::placeholder { color:#555; }
  table { width:100%; border-collapse:collapse; }
  thead tr { background:var(--dark4); }
  th { padding:14px 20px; text-align:right; font-size:0.8rem; color:var(--gray); font-weight:700; }
  td { padding:16px 20px; font-size:0.9rem; border-bottom:1px solid rgba(255,255,255,0.04); }
  tr:last-child td { border-bottom:none; }
  tr:hover td { background:rgba(255,255,255,0.02); }
  .status-badge { display:inline-flex; align-items:center; padding:5px 12px; border-radius:20px; font-size:0.8rem; font-weight:700; }
  .status-new { background:rgba(59,130,246,0.12); color:var(--blue); }
  .status-progress { background:rgba(245,158,11,0.12); color:var(--yellow); }
  .status-done { background:rgba(34,197,94,0.12); color:var(--green); }
  .status-cancel { background:rgba(239,68,68,0.12); color:var(--red); }
  .action-btns { display:flex; gap:8px; }
  .action-btn { padding:6px 14px; border-radius:8px; font-family:'Cairo',sans-serif; font-size:0.8rem; font-weight:700; cursor:pointer; border:none; transition:0.2s; }
  .btn-confirm { background:rgba(34,197,94,0.12); color:var(--green); }
  .btn-confirm:hover { background:rgba(34,197,94,0.25); }
  .btn-progress { background:rgba(245,158,11,0.12); color:var(--yellow); }
  .btn-progress:hover { background:rgba(245,158,11,0.25); }
  .btn-cancel { background:rgba(239,68,68,0.12); color:var(--red); }
  .btn-cancel:hover { background:rgba(239,68,68,0.25); }
  .btn-view { background:rgba(59,130,246,0.12); color:var(--blue); }
  .btn-view:hover { background:rgba(59,130,246,0.25); }
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); backdrop-filter:blur(4px); z-index:999; align-items:center; justify-content:center; }
  .modal-overlay.open { display:flex; }
  .modal { background:var(--dark3); border:1px solid rgba(255,255,255,0.08); border-radius:24px; padding:36px; width:500px; max-width:90vw; animation:fadeUp 0.25s ease; }
  .modal h3 { font-size:1.2rem; font-weight:700; margin-bottom:20px; }
  .modal-row { display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid rgba(255,255,255,0.05); }
  .modal-row:last-of-type { border-bottom:none; }
  .modal-label { color:var(--gray); font-size:0.9rem; }
  .modal-value { font-weight:600; font-size:0.9rem; max-width:280px; text-align:left; }
  .modal-actions { display:flex; gap:12px; margin-top:24px; flex-wrap:wrap; }
  .modal-btn { flex:1; padding:12px; border-radius:12px; font-family:'Cairo',sans-serif; font-weight:700; font-size:0.9rem; cursor:pointer; border:none; transition:0.2s; min-width:100px; }
  .modal-btn-green { background:var(--green); color:white; }
  .modal-btn-yellow { background:var(--yellow); color:white; }
  .modal-btn-red { background:rgba(239,68,68,0.12); color:var(--red); border:1px solid rgba(239,68,68,0.2); }
  .modal-close { float:left; background:none; border:none; color:var(--gray); font-size:1.4rem; cursor:pointer; }
  .loading { text-align:center; padding:60px; color:var(--gray); font-size:1rem; }
  .empty-state { text-align:center; padding:60px 20px; color:#555; }
  .empty-state div { font-size:3rem; margin-bottom:12px; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
  @media(max-width:1024px) { .stats-grid{grid-template-columns:repeat(2,1fr)} }
  @media(max-width:768px) { .sidebar{display:none} .main{margin-right:0;padding:20px} .stats-grid{grid-template-columns:repeat(2,1fr)} }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo">
    <h2>خدمات<span>ي</span></h2>
    <p>لوحة التحكم</p>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-item active">📊 الرئيسية</div>
    <div class="nav-item">📋 الطلبات</div>
    <div class="nav-item">👷 الفنيون</div>
    <div class="nav-item">👥 العملاء</div>
    <a href="index.html" class="nav-item">🌐 الموقع</a>
  </nav>
  <div class="sidebar-footer">الإصدار 1.0 — خدماتي</div>
</aside>

<main class="main">
  <div class="topbar">
    <div><h1>لوحة التحكم</h1><p id="lastUpdate">جاري التحميل...</p></div>
    <div class="topbar-actions">
      <button class="refresh-btn" onclick="loadOrders()">🔄 تحديث</button>
      <div class="admin-avatar">أ</div>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card"><div class="stat-top"><span class="stat-icon">📋</span><span class="stat-badge badge-blue">الكل</span></div><div class="stat-num" id="statTotal">—</div><div class="stat-label">إجمالي الطلبات</div></div>
    <div class="stat-card"><div class="stat-top"><span class="stat-icon">🆕</span><span class="stat-badge badge-yellow">جديد</span></div><div class="stat-num" id="statNew">—</div><div class="stat-label">طلبات جديدة</div></div>
    <div class="stat-card"><div class="stat-top"><span class="stat-icon">⏳</span><span class="stat-badge badge-blue">نشط</span></div><div class="stat-num" id="statProgress">—</div><div class="stat-label">قيد التنفيذ</div></div>
    <div class="stat-card"><div class="stat-top"><span class="stat-icon">✅</span><span class="stat-badge badge-green">مكتمل</span></div><div class="stat-num" id="statDone">—</div><div class="stat-label">طلبات مكتملة</div></div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="filterOrders('all',this)">الكل</button>
    <button class="tab" onclick="filterOrders('new',this)">جديد</button>
    <button class="tab" onclick="filterOrders('progress',this)">قيد التنفيذ</button>
    <button class="tab" onclick="filterOrders('done',this)">مكتمل</button>
    <button class="tab" onclick="filterOrders('cancel',this)">ملغي</button>
  </div>

  <div class="table-container">
    <div class="table-header">
      <h3>الطلبات <span id="ordersCount" style="color:var(--gray);font-size:0.85rem"></span></h3>
      <input class="search-input" placeholder="🔍 ابحث..." oninput="searchOrders(this.value)">
    </div>
    <table>
      <thead><tr><th>#</th><th>العميل</th><th>الخدمة</th><th>الموعد</th><th>تاريخ الطلب</th><th>الحالة</th><th>إجراءات</th></tr></thead>
      <tbody id="ordersTable"><tr><td colspan="7"><div class="loading">⏳ جاري التحميل...</div></td></tr></tbody>
    </table>
  </div>
</main>

<div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <h3>📋 تفاصيل الطلب</h3>
    <div id="modalContent"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://unbaoaphxbyunvqmrnjy.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_Q6uccUPkusIYhBbsxzrz3w_ZFijNQWN';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const statusMap = {
    new: { label:'جديد', cls:'status-new' },
    progress: { label:'قيد التنفيذ', cls:'status-progress' },
    done: { label:'مكتمل', cls:'status-done' },
    cancel: { label:'ملغي', cls:'status-cancel' },
  };

  let allOrders = [];
  let currentFilter = 'all';
  let currentOrderId = null;

  async function loadOrders() {
    const { data, error } = await sb.from('orders').select('*').order('created_at', { ascending: false });
    if (error) { console.error(error); return; }
    allOrders = data || [];
    updateStats();
    renderTable(getFiltered());
    document.getElementById('lastUpdate').textContent = 'آخر تحديث: ' + new Date().toLocaleTimeString('ar-EG');
  }

  function updateStats() {
    document.getElementById('statTotal').textContent = allOrders.length;
    document.getElementById('statNew').textContent = allOrders.filter(o=>o.status==='new').length;
    document.getElementById('statProgress').textContent = allOrders.filter(o=>o.status==='progress').length;
    document.getElementById('statDone').textContent = allOrders.filter(o=>o.status==='done').length;
  }

  function getFiltered() {
    if (currentFilter === 'all') return allOrders;
    return allOrders.filter(o => o.status === currentFilter);
  }

  function renderTable(data) {
    const tbody = document.getElementById('ordersTable');
    document.getElementById('ordersCount').textContent = '(' + data.length + ')';
    if (!data.length) {
      tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state"><div>📭</div>لا توجد طلبات</div></td></tr>';
      return;
    }
    tbody.innerHTML = data.map(o => {
      const s = statusMap[o.status] || statusMap.new;
      const date = o.created_at ? new Date(o.created_at).toLocaleString('ar-EG') : '—';
      return `<tr>
        <td style="color:#555">#${o.id}</td>
        <td><div style="font-weight:700">${o.name}</div><div style="font-size:0.8rem;color:#666">${o.phone}</div></td>
        <td>${o.service}</td>
        <td style="font-size:0.82rem;color:#aaa">${o.date||'—'}</td>
        <td style="font-size:0.82rem;color:#aaa">${date}</td>
        <td><span class="status-badge ${s.cls}">${s.label}</span></td>
        <td><div class="action-btns">
          <button class="action-btn btn-view" onclick="viewOrder(${o.id})">عرض</button>
          ${o.status==='new'?`<button class="action-btn btn-progress" onclick="changeStatus(${o.id},'progress')">قبول</button>`:''}
          ${o.status==='progress'?`<button class="action-btn btn-confirm" onclick="changeStatus(${o.id},'done')">إتمام</button>`:''}
          ${o.status!=='done'&&o.status!=='cancel'?`<button class="action-btn btn-cancel" onclick="changeStatus(${o.id},'cancel')">إلغاء</button>`:''}
        </div></td>
      </tr>`;
    }).join('');
  }

  function filterOrders(filter, btn) {
    currentFilter = filter;
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    btn.classList.add('active');
    renderTable(getFiltered());
  }

  function searchOrders(q) {
    const filtered = allOrders.filter(o =>
      (o.name||'').includes(q)||(o.service||'').includes(q)||(o.phone||'').includes(q)||(o.address||'').includes(q)
    );
    renderTable(filtered);
  }

  async function changeStatus(id, status) {
    await sb.from('orders').update({ status }).eq('id', id);
    await loadOrders();
    closeModal();
  }

  function viewOrder(id) {
    const o = allOrders.find(x=>x.id===id);
    if (!o) return;
    currentOrderId = id;
    const s = statusMap[o.status] || statusMap.new;
    const date = o.created_at ? new Date(o.created_at).toLocaleString('ar-EG') : '—';
    document.getElementById('modalContent').innerHTML = `
      <div class="modal-row"><span class="modal-label">رقم الطلب</span><span class="modal-value">#${o.id}</span></div>
      <div class="modal-row"><span class="modal-label">العميل</span><span class="modal-value">${o.name}</span></div>
      <div class="modal-row"><span class="modal-label">الهاتف</span><span class="modal-value">${o.phone}</span></div>
      <div class="modal-row"><span class="modal-label">الخدمة</span><span class="modal-value">${o.service}</span></div>
      <div class="modal-row"><span class="modal-label">الموعد</span><span class="modal-value">${o.date||'لم يحدد'}</span></div>
      <div class="modal-row"><span class="modal-label">العنوان</span><span class="modal-value">${o.address}</span></div>
      <div class="modal-row"><span class="modal-label">التفاصيل</span><span class="modal-value">${o.details||'—'}</span></div>
      <div class="modal-row"><span class="modal-label">تاريخ الطلب</span><span class="modal-value">${date}</span></div>
      <div class="modal-row"><span class="modal-label">الحالة</span><span class="status-badge ${s.cls}">${s.label}</span></div>
    `;
    const actions = document.getElementById('modalActions');
    actions.innerHTML = '';
    if (o.status==='new') actions.innerHTML += `<button class="modal-btn modal-btn-yellow" onclick="changeStatus(${id},'progress')">⏳ قيد التنفيذ</button>`;
    if (o.status==='new'||o.status==='progress') actions.innerHTML += `<button class="modal-btn modal-btn-green" onclick="changeStatus(${id},'done')">✓ مكتمل</button>`;
    if (o.status!=='done'&&o.status!=='cancel') actions.innerHTML += `<button class="modal-btn modal-btn-red" onclick="changeStatus(${id},'cancel')">✕ إلغاء</button>`;
    document.getElementById('modalOverlay').classList.add('open');
  }

  function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }
  function closeModalOutside(e) { if(e.target===document.getElementById('modalOverlay')) closeModal(); }

  // تحديث تلقائي كل 30 ثانية
  loadOrders();
  setInterval(loadOrders, 30000);
</script>
</body>
</html>
